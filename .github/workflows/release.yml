name: Release

# Push a tag like v0.1.0 to publish a GitHub release with a single WindowsOptimizer.exe.
# If the SIGNPATH_ORGANIZATION_ID repository variable is set, the exe is code-signed first (see packaging/SIGNING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test WindowsOptimizer.sln -c Release --nologo

      - name: Publish single-file executable
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/WindowsOptimizer.App -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$version `
            -o publish

      - name: Name the executable
        shell: pwsh
        run: |
          $name = "WindowsOptimizer-${{ github.ref_name }}-win-x64.exe"
          Move-Item publish/WindowsOptimizer.exe "publish/$name"
          "EXE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --- Optional code signing with SignPath (free for open-source projects) ---
      - name: Upload the unsigned executable
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-executable
          path: publish/${{ env.EXE_NAME }}

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'windows-optimizer' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed executable
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: Copy-Item "signed/$env:EXE_NAME" "publish/$env:EXE_NAME" -Force

      # The checksum is of the file people will actually download, so it comes after signing.
      - name: Write the checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "publish/$env:EXE_NAME" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:EXE_NAME" | Out-File "publish/$env:EXE_NAME.sha256" -Encoding ascii

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/*.exe
            publish/*.sha256
          generate_release_notes: true
          # Tags like v0.1.0-rc1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
